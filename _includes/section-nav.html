{% include i18n.html %}
<nav class="section-nav" data-section-nav hidden aria-label="{{ i18n.layout.on_this_page | default: 'On this page' }}">
  <button class="section-nav__rail" type="button" aria-expanded="false" aria-controls="section-nav-panel">
    <span class="screen-reader-text">{{ i18n.layout.on_this_page | default: 'On this page' }}</span>
  </button>

  <div class="section-nav__panel" id="section-nav-panel" hidden>
    <p class="section-nav__heading">{{ i18n.layout.contents | default: 'Contents' }}</p>
    <ol class="section-nav__list"></ol>
  </div>
</nav>

<style>
  .section-nav {
    --section-nav-bg: var(--global-background-color, #050814);
    --section-nav-border: var(--global-border-color, rgba(255, 255, 255, 0.18));
    --section-nav-text: var(--global-text-color, #dedede);
    --section-nav-muted: var(--global-muted-text-color, #b0b0b0);
    --section-nav-accent: var(--global-primary-color, #00adb5);
    --section-nav-edge-gap: 1rem;

    color: var(--section-nav-text);
    display: none;
    font-family: var(--global-font-family, inherit);
    left: var(--section-nav-left, var(--section-nav-edge-gap));
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 1000;
  }

  .section-nav[hidden] {
    display: none !important;
  }

  @media (min-width: 768px) {
    .section-nav:not([hidden]) {
      display: block;
    }
  }

  .section-nav__rail {
    align-items: flex-end;
    background: transparent;
    border: 0;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin: 0;
    padding: 12px 8px;
    width: 28px;
  }

  .section-nav__mark {
    background: var(--section-nav-muted);
    display: block;
    flex-shrink: 0;
    height: 1px;
    width: 12px;
  }

  .section-nav__mark--h3 {
    width: 8px;
  }

  .section-nav__mark.is-active {
    background: var(--section-nav-accent);
  }

  .section-nav__panel {
    background: var(--section-nav-bg);
    border: 1px solid var(--section-nav-border);
    border-radius: 8px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.45), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
    left: 100%;
    max-height: min(70vh, 36rem);
    opacity: 0;
    overflow-y: auto;
    padding: 8px;
    pointer-events: none;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    visibility: hidden;
    width: 258px;
    z-index: 1;
  }

  .section-nav__panel::before {
    bottom: 0;
    content: "";
    position: absolute;
    right: 100%;
    top: 0;
    width: 12px;
  }

  .section-nav.is-open .section-nav__panel {
    opacity: 1;
    pointer-events: auto;
    visibility: visible;
  }

  @media (prefers-reduced-motion: no-preference) {
    .section-nav__panel {
      transition: opacity 0.15s ease, visibility 0.15s ease;
    }
  }

  .section-nav__heading {
    color: var(--section-nav-text);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2px;
    line-height: 20px;
    margin: 0 0 4px;
    padding: 4px;
    text-transform: uppercase;
  }

  .section-nav__list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .section-nav__item {
    margin: 0;
  }

  .section-nav__link {
    color: var(--section-nav-muted);
    display: block;
    font-size: 15px;
    font-weight: 400;
    line-height: 20px;
    overflow: hidden;
    padding: 4px;
    text-decoration: none;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .section-nav__item--h3 .section-nav__link {
    padding-left: 1rem;
  }

  .section-nav__link:hover,
  .section-nav__link:focus {
    color: var(--section-nav-text);
  }

  .section-nav__link.is-active {
    color: var(--section-nav-accent);
  }

  .section-nav__rail:focus-visible,
  .section-nav__link:focus-visible {
    outline: 2px solid var(--section-nav-accent);
    outline-offset: 0.25rem;
  }
</style>

<script>
  (function () {
    function ready(callback) {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', callback);
      } else {
        callback();
      }
    }

    ready(function () {
      var nav = document.querySelector('[data-section-nav]');
      var content = document.querySelector('.page__content') || document.querySelector('.archive');

      if (!nav || !content) {
        return;
      }

      var headings = Array.prototype.slice.call(content.querySelectorAll('h2, h3')).filter(function (heading) {
        return headingLabel(heading).length > 0;
      });

      if (headings.length < 2) {
        return;
      }

      var rail = nav.querySelector('.section-nav__rail');
      var panel = nav.querySelector('.section-nav__panel');
      var list = nav.querySelector('.section-nav__list');
      var sidebar = document.getElementById('site-header');
      var usedIds = {};
      var marksById = {};
      var linksById = {};
      var openTimer = null;
      var closeTimer = null;
      var OPEN_DELAY = 80;
      var CLOSE_DELAY = 160;

      function headingLabel(heading) {
        var toggleLabel = heading.querySelector('.game-section__toggle span:first-child');

        if (toggleLabel && toggleLabel.textContent.trim()) {
          return toggleLabel.textContent.trim();
        }

        return heading.textContent.trim();
      }

      function slugify(text) {
        return text.toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '') || 'section';
      }

      function ensureHeadingId(heading) {
        var base = heading.id || slugify(headingLabel(heading));
        var id = base;
        var index = 2;

        while ((usedIds[id] || document.getElementById(id)) && document.getElementById(id) !== heading) {
          id = base + '-' + index;
          index++;
        }

        heading.id = id;
        usedIds[id] = true;
        return id;
      }

      function getPixelValue(name) {
        var value = window.getComputedStyle(nav).getPropertyValue(name);
        return parseFloat(value) || 0;
      }

      function setOpen(isOpen) {
        nav.classList.toggle('is-open', isOpen);
        rail.setAttribute('aria-expanded', String(isOpen));
        panel.hidden = !isOpen;
      }

      function scheduleOpen() {
        window.clearTimeout(closeTimer);
        window.clearTimeout(openTimer);
        openTimer = window.setTimeout(function () {
          setOpen(true);
        }, OPEN_DELAY);
      }

      function scheduleClose() {
        window.clearTimeout(openTimer);
        window.clearTimeout(closeTimer);
        closeTimer = window.setTimeout(function () {
          setOpen(false);
        }, CLOSE_DELAY);
      }

      function setActive(id) {
        Object.keys(marksById).forEach(function (markId) {
          marksById[markId].classList.toggle('is-active', markId === id);
        });
        Object.keys(linksById).forEach(function (linkId) {
          linksById[linkId].classList.toggle('is-active', linkId === id);
        });
      }

      function updatePlacement() {
        var edgeGap = getPixelValue('--section-nav-edge-gap') || 16;
        var sidebarRight = sidebar ? sidebar.getBoundingClientRect().right : 0;
        nav.style.setProperty('--section-nav-left', (sidebarRight + edgeGap) + 'px');
      }

      headings.forEach(function (heading) {
        var id = ensureHeadingId(heading);
        var level = heading.tagName.toLowerCase();
        var label = headingLabel(heading);
        var mark = document.createElement('span');
        var item = document.createElement('li');
        var link = document.createElement('a');

        mark.className = 'section-nav__mark section-nav__mark--' + level;
        mark.setAttribute('aria-hidden', 'true');
        rail.appendChild(mark);
        marksById[id] = mark;

        item.className = 'section-nav__item section-nav__item--' + level;
        link.className = 'section-nav__link';
        link.href = '#' + id;
        link.textContent = label;
        link.title = label;

        link.addEventListener('click', function (event) {
          event.preventDefault();
          heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
          history.replaceState(null, '', '#' + id);
          setActive(id);
          setOpen(false);
        });

        item.appendChild(link);
        list.appendChild(item);
        linksById[id] = link;
      });

      nav.addEventListener('mouseenter', scheduleOpen);
      nav.addEventListener('mouseleave', scheduleClose);

      rail.addEventListener('click', function (event) {
        event.stopPropagation();
        window.clearTimeout(openTimer);
        window.clearTimeout(closeTimer);
        setOpen(true);
      });

      nav.addEventListener('focusin', function () {
        window.clearTimeout(closeTimer);
        setOpen(true);
      });

      nav.addEventListener('focusout', function (event) {
        if (!nav.contains(event.relatedTarget)) {
          scheduleClose();
        }
      });

      document.addEventListener('click', function (event) {
        if (!nav.contains(event.target)) {
          setOpen(false);
        }
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && nav.classList.contains('is-open')) {
          setOpen(false);
          rail.focus();
        }
      });

      nav.hidden = false;
      updatePlacement();
      window.addEventListener('resize', updatePlacement);

      if ('IntersectionObserver' in window) {
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              setActive(entry.target.id);
            }
          });
        }, {
          rootMargin: '-20% 0px -65% 0px',
          threshold: 0
        });

        headings.forEach(function (heading) {
          observer.observe(heading);
        });
      }

      window.addEventListener('scroll', function () {
        var current = headings[0];

        headings.forEach(function (heading) {
          if (heading.getBoundingClientRect().top <= 120) {
            current = heading;
          }
        });

        setActive(current.id);
      }, { passive: true });

      setActive(headings[0].id);
    });
  }());
</script>
